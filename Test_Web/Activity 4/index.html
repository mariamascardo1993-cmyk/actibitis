<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Student Registration Form</title>
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>
    <main class="page">
        <section class="form-card" aria-labelledby="form-title">
            <h1 id="form-title">Student Registration</h1>
            <p class="intro">Register to join a school club.</p>

            <form>
                <div class="form-group">
                    <label for="student-name">Name</label>
                    <input id="student-name" type="text" autocomplete="name" required>
                </div>

                <div class="form-group">
                    <label for="student-email">Email</label>
                    <input id="student-email" type="email" autocomplete="email" required>
                </div>

                <div class="form-group">
                    <label for="course">Course</label>
                    <select id="course" required>
                        <option value="" selected disabled>Select your course</option>
                        <option value="bsit">BS Information Technology</option>
                        <option value="bscs">BS Computer Science</option>
                        <option value="bsba">BS Business Administration</option>
                        <option value="other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="reason">Why do you want to join?</label>
                    <textarea id="reason" rows="4"></textarea>
                </div>

                <button type="submit">Submit Registration</button>
            </form>
        </section>
    </main>
</body>
</html>
